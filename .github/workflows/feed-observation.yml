name: Public feed observation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-discovery-diagnostic
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No repository secrets or Telegram delivery. Exit 2 means incomplete.
      - run: npm run check:feeds
